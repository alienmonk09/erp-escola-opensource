# ci.yml — pipeline esqueleto da fundação (F-01, rev. pós-review)
# Fonte: SRS §27 (filtros por caminho, concurrency, cache, paralelismo),
# RS-061 (Actions fixadas por hash de commit), RS-062 (PRs de fork rodam sem
# secrets — nenhum trigger privilegiado que exponha secrets a código de terceiros).
#
# Estado em F-02: jobs com a estrutura final (§27). Os gates de backend e
# frontend executam `task gerar:checar` com ferramentas fixadas (oapi-codegen
# via go install, Orval/Redocly via workspace pnpm — ver mise.toml);
# golangci-lint/govulncheck entram em F-04, Vitest/ESLint em F-07.
# E2E/Lighthouse/ZAP/backup ficam SÓ na main ou agendados — nunca por PR (§27).
#
# Todas as actions estão fixadas por HASH DE COMMIT (RS-061) no formato
# `owner/repo@SHA`; o comentário `# vX.Y.Z` registra a tag correspondente,
# verificada em 2026-09-16 via `git ls-remote` nos repositórios oficiais.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Em PR, novo push cancela o workflow anterior do mesmo ref (§27).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detecta o que mudou para filtrar os jobs seguintes (§27).
  # Falha fechada: se o diff não puder ser calculado, o workflow falha em vez
  # de liberar gates com filtros falsos (AGENTS.md §9).
  mudancas:
    name: detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      contrato: ${{ steps.filtro.outputs.contrato }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Histórico completo: o diff precisa da base e do head (SRS §27).
          fetch-depth: 0
      - id: filtro
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "Base de diff: $BASE"
          # Base zerada (ex.: push inicial): sem diff confiável, falha fechada.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "ERRO: base zerada, impossível calcular o diff — falhando em vez de pular gates." >&2
            exit 1
          fi
          ARQUIVOS=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$ARQUIVOS"
          {
            echo "backend=false"
            echo "frontend=false"
            echo "contrato=false"
          } >> "$GITHUB_OUTPUT"
          echo "$ARQUIVOS" | grep -Eq '^(backend/|api/)' && echo "backend=true" >> "$GITHUB_OUTPUT" || true
          echo "$ARQUIVOS" | grep -Eq '^(frontend/|api/)' && echo "frontend=true" >> "$GITHUB_OUTPUT" || true
          echo "$ARQUIVOS" | grep -Eq '^api/' && echo "contrato=true" >> "$GITHUB_OUTPUT" || true

  backend:
    name: backend
    needs: mudancas
    # §27: backend/** ou api/** → job backend; api/** roda sempre os dois.
    if: needs.mudancas.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Portão de existência: setups só rodam quando há módulo Go (a partir da
      # F-01 o hello existe, então este gate passa; mantido para robustez).
      - id: existe
        run: |
          if [ -f backend/go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Setup Go
        if: steps.existe.outputs.go == 'true'
        # Versão espelha mise.toml (F-01: 1.27.1). Sem cache-dependency-path:
        # o cache de módulos é ligado em F-04 com o shell do backend (SRS §27);
        # na F-02 o go.sum já existe (chi + runtime do gerado, §19).
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Setup Task (versão fixada)
        if: steps.existe.outputs.go == 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Setup oapi-codegen (versão fixada — F-02, ver mise.toml)
        if: steps.existe.outputs.go == 'true'
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Setup sqlc (versão fixada — gera backend/internal/db em F-03)
        if: steps.existe.outputs.go == 'true'
        # `task gerar:sql` exige o binário; sem ele o gate gerar:checar falha.
        # Versão espelha a usada no desenvolvimento da F-03.
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Setup pnpm
        if: steps.existe.outputs.go == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.19.0
      - name: Setup Node
        if: steps.existe.outputs.go == 'true'
        # `gerar:checar` regenera tudo (inclusive o frontend via Orval), por
        # isso o job backend também instala o workspace raiz (F-02).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Instalar workspace (Orval/Redocly fixados — F-02)
        if: steps.existe.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - name: Gate backend
        run: |
          if [ "${{ steps.existe.outputs.go }}" != "true" ]; then
            echo "sem backend/go.mod — nada a fiscalizar"
            exit 0
          fi
          task lint && task gerar:checar

  frontend:
    name: frontend
    needs: mudancas
    # §27: frontend/** ou api/** → job frontend.
    if: needs.mudancas.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: existe
        run: |
          if [ -f frontend/package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi
      - name: Setup pnpm
        if: steps.existe.outputs.node == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.19.0
      - name: Setup Node
        if: steps.existe.outputs.node == 'true'
        # Versão espelha mise.toml (F-01: 24.21.0). Cache pnpm com o lockfile
        # versionado na RAIZ (RS-061); o workspace (F-02) unificou os
        # lockfiles — `frontend/pnpm-lock.yaml` foi movido para a raiz.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Go + Task (runner das tasks do Taskfile)
        if: steps.existe.outputs.node == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache: false
      - run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        if: steps.existe.outputs.node == 'true'
      - name: Gate frontend
        run: |
          if [ "${{ steps.existe.outputs.node }}" != "true" ]; then
            echo "sem frontend/package.json — nada a fiscalizar"
            exit 0
          fi
          pnpm install --frozen-lockfile
          task typecheck && task testes && task gerar:checar

  contrato:
    name: contrato
    needs: mudancas
    # §27: api/** → job contrato (e sempre os dois acima).
    if: needs.mudancas.outputs.contrato == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.19.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          # Cache de dependências do contrato ligado em F-02 (SRS §27):
          # Redocly fixado como devDep da raiz (ver mise.toml, RS-061).
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Gate contrato
        run: |
          if [ ! -f api/openapi.yaml ]; then
            echo "api/openapi.yaml ainda não existe (criado na F-02) — Redocly lint entra em F-02"
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm exec redocly lint --config api/redocly.yaml api/openapi.yaml

  seguranca:
    name: segurança
    needs: [backend, frontend, contrato]
    # Roda mesmo se um gate for pulado por filtro (always), mas falha se algum rodou e falhou.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks (segredos no repo — RS-060/RS-066)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Portões futuros (memória F-01)
        run: |
          echo "OSV-Scanner, govulncheck e zizmor entram neste job em F-04 (SRS §27/§28, RS-061)."
      - name: Falhar se algum gate anterior falhou
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "Um dos gates (backend/frontend/contrato) falhou — PR bloqueado (RE-07)." >&2
          exit 1
